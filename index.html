    <!-- Netlify Badge / Watermark Prevention -->
    <script>
      try {
        localStorage.setItem('nl-hud:public:v1', 'hidden');
        localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
      } catch (e) {}

      // Immediate DOM guard to remove Netlify badge iframe if injected
      const observer = new MutationObserver(() => {
        const frame = document.getElementById('nl-badge-frame') || document.getElementById('nl-hud-frame') || document.querySelector('iframe[title="Powered by Netlify"]');
        if (frame) {
          frame.remove();
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
